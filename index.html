<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizz Check</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.25), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(0, 183, 255, 0.22), transparent 35%),
        linear-gradient(135deg, #050505, #111827 45%, #1a0b2e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .glow {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: float 6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .glow.one {
      background: #ff007a;
      top: -80px;
      left: -80px;
    }

    .glow.two {
      background: #00c8ff;
      bottom: -90px;
      right: -70px;
      animation-delay: 1s;
    }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(35px, -25px) scale(1.12); }
    }

    .card {
      width: min(94vw, 760px);
      min-height: 520px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 28px;
      background: rgba(10, 10, 18, 0.72);
      box-shadow: 0 22px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(18px);
      padding: 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      letter-spacing: 0.4px;
      color: rgba(255,255,255,0.82);
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(34px, 8vw, 64px);
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 0 24px rgba(255,255,255,0.18);
    }

    .subtitle {
      color: rgba(255,255,255,0.72);
      font-size: clamp(15px, 3vw, 18px);
      margin-bottom: 24px;
    }

    .button-area {
      position: relative;
      width: 100%;
      height: 260px;
      margin-top: 10px;
    }

    button {
      position: absolute;
      border: 0;
      border-radius: 18px;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, left 0.18s ease, top 0.18s ease;
      user-select: none;
    }

    button:active {
      transform: scale(0.96);
    }

    #yesBtn {
      left: 25%;
      top: 92px;
      color: white;
      background: linear-gradient(135deg, #00d26a, #00a3ff);
      box-shadow: 0 14px 28px rgba(0, 210, 106, 0.25);
    }

    #noBtn {
      left: 56%;
      top: 92px;
      color: white;
      background: linear-gradient(135deg, #ff1744, #ff9100);
      box-shadow: 0 14px 28px rgba(255, 23, 68, 0.25);
    }

    .video-section {
      display: none;
      animation: pop 0.45s ease forwards;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.94);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .result {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 900;
      margin-bottom: 16px;
      color: #ffd166;
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.28);
    }

    video {
      width: 100%;
      max-height: 58vh;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.14);
      background: black;
      box-shadow: 0 18px 42px rgba(0,0,0,0.55);
      display: block;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.58);
    }

    .shake {
      animation: shake 0.28s linear;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 520px) {
      .card {
        min-height: 500px;
        padding: 22px;
      }

      .button-area {
        height: 280px;
      }

      button {
        padding: 14px 25px;
        font-size: 18px;
      }

      #yesBtn {
        left: 13%;
        top: 95px;
      }

      #noBtn {
        left: 55%;
        top: 95px;
      }
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="card" id="card">
    <div class="badge">🔥 Official Rizz Detector</div>

    <section id="questionSection">
      <h1>Am I pogi? 😏</h1>
      <p class="subtitle">Answer carefully. The wrong button has trust issues.</p>

      <div class="button-area" id="buttonArea">
        <button id="yesBtn">YES 😎</button>
        <button id="noBtn">NO 💀</button>
      </div>

      <p class="hint">Tip: try pressing NO. I dare you.</p>
    </section>

    <section class="video-section" id="videoSection">
      <div class="result">SABI KONA NGA BA EH 😮‍💨🔥</div>

      <video id="rizzVideo" controls playsinline>
        <source src="rizz.mp4" type="video/mp4">
        Your browser cannot play this video.
      </video>
    </section>
  </main>

  <script>
    const card = document.getElementById("card");
    const buttonArea = document.getElementById("buttonArea");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const questionSection = document.getElementById("questionSection");
    const videoSection = document.getElementById("videoSection");
    const rizzVideo = document.getElementById("rizzVideo");

    let noClicks = 0;
    const noTexts = [
      "NO 💀",
      "MALI NGA PUTA ❌",
      "MAG YES KANA 😭",
      "SUBUKAN MO LANG",
      "8080 KABA? ",
      "MAG YES KA NALNG KASI! 🙄"
    ];

    function playBuzzer() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const audioCtx = new AudioContext();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(180, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.28);

      gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.32);

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.32);
    }

    function moveNoButton() {
      playBuzzer();

      if (navigator.vibrate) {
        navigator.vibrate(90);
      }

      const areaRect = buttonArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = Math.max(0, areaRect.width - btnRect.width);
      const maxY = Math.max(0, areaRect.height - btnRect.height);

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";

      noClicks++;
      noBtn.textContent = noTexts[noClicks % noTexts.length];

      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);
    noBtn.addEventListener("touchstart", function(event) {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    yesBtn.addEventListener("click", function() {
      questionSection.style.display = "none";
      videoSection.style.display = "block";

      rizzVideo.currentTime = 0;
      rizzVideo.play().catch(function() {
        // Some browsers block autoplay. User can press play manually.
      });
    });
  </script>
</body>
</html>
